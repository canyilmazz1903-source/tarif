# Tencere — Codemagic CI/CD
#
# 3 workflow:
#   1. android-onizleme : Hiçbir imzalama/hesap kurulumu GEREKTİRMEZ. İlk "yeşil build" için bunu çalıştır.
#   2. ios-appstore     : App Store Connect entegrasyonu (Codemagic API) + apple_credentials
#                         environment group'u ister (CERTIFICATE_PRIVATE_KEY değişkeni).
#                         İmzalama, diğer app'lerde kanıtlanmış manuel yöntemle yapılır
#                         (fetch-signing-files --create), ios_signing bloğu KULLANILMAZ.
#   3. android-playstore: Keystore ister (referans adı: tencere_keystore).
#
# Kurulum adımları için repodaki README ve App Store kurulum rehberine bak.
workflows:
  android-onizleme:
    name: Android Önizleme APK (imzasız kurulum, ilk test)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
      node: 22.14.0
      vars:
        EXPO_NO_TELEMETRY: "1"
    scripts:
      - name: Bağımlılıkları kur
        script: npm ci
      - name: Testler + tip kontrolü
        script: |
          npx tsc --noEmit
          npx jest --ci
      - name: Expo prebuild (android)
        script: npx expo prebuild --platform android --no-install && cd android && chmod +x gradlew
      - name: Release APK derle
        script: cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-appstore:
    name: iOS App Store / TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Codemagic > Teams > Integrations > App Store Connect'teki API anahtarının adı
      app_store_connect: Codemagic API
    environment:
      groups:
        # Bu group CERTIFICATE_PRIVATE_KEY değişkenini içerir (UdHocam'la aynı).
        # Group, UdHocam uygulamasının kendi ayarlarında tanımlıysa Tencere'de
        # görünmez — Tencere'ye de aynı adla ekle veya Team seviyesine taşı.
        - apple_credentials
      node: 22.14.0
      xcode: latest
      cocoapods: default
      vars:
        EXPO_NO_TELEMETRY: "1"
    scripts:
      - name: Bağımlılıkları kur
        script: npm ci
      - name: Testler + tip kontrolü
        script: |
          npx tsc --noEmit
          npx jest --ci
      - name: Expo prebuild (ios)
        script: npx expo prebuild --platform ios --no-install
      - name: CocoaPods
        script: cd ios && pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.canyilmaz.tencere" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      - name: IPA derle
        script: |
          xcode-project build-ipa \
            --workspace ios/Tencere.xcworkspace \
            --scheme Tencere \
            --verbose || {
              echo "=== Export IPA Failed. Printing Codemagic Logs ==="
              cat $TMPDIR/codemagic-*.log 2>/dev/null || cat /var/folders/*/*/*/T/codemagic-*.log 2>/dev/null
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-playstore:
    name: Android Play Store AAB (imzalı)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
      node: 22.14.0
      android_signing:
        # Codemagic > Teams > Code signing identities > Android'e keystore'u
        # TAM OLARAK bu referans adıyla yükle: tencere_keystore
        - tencere_keystore
      vars:
        EXPO_NO_TELEMETRY: "1"
    scripts:
      - name: Bağımlılıkları kur
        script: npm ci
      - name: Testler + tip kontrolü
        script: |
          npx tsc --noEmit
          npx jest --ci
      - name: Expo prebuild (android)
        script: npx expo prebuild --platform android --no-install && cd android && chmod +x gradlew
      - name: İmzalı AAB derle
        script: |
          cd android
          cat >> app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
